[project]
name = "net-twin-backend"
version = "0.1.0"
description = "net-twin: real-time digital twin for network topology discovery and monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "networkx>=3.3",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
net = [
    "scapy>=2.5",
    "pysnmp>=6.0",
    "python-nmap>=0.7",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Depends() in argument defaults is the FastAPI idiom
    "UP042", # str+Enum mixin kept for SQLAlchemy/pydantic serialization
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
